name: CI
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.f.outputs.python }}
      web: ${{ steps.f.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            python:
              - 'packages/**'
              - 'apps/gateway/**'
              - 'apps/ai-service/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.importlinter'
            web:
              - 'apps/web/**'
              - 'packages/shared/src/shared/contracts/**'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy packages/shared/src apps/gateway/src apps/ai-service/src
      - run: uv run lint-imports
      - run: uv run pytest -m "not llm" --cov

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm build

  smoke:
    # Gọi OpenAI thật → chỉ chạy trên main hoặc khi bấm tay (cần secret OPENAI_API_KEY)
    needs: [python, web]
    if: ${{ !failure() && !cancelled() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: ./scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }

  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-eval')
    needs: [smoke]
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose up -d --build && ./scripts/wait-ready.sh
      - run: uv run python -m evals.run_eval --thresholds evals/thresholds.yaml --report evals/reports/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/reports/ci.* }
