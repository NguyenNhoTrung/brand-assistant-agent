[project]
name = "shared"
version = "0.1.0"
description = "Giao thức giữa các service: contracts, Redis keys, Lua. KHÔNG chứa business logic."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "redis>=6.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
