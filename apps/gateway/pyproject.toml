[project]
name = "gateway"
version = "0.1.0"
description = "AI Gateway: Basic Auth, tạo job idempotent, SSE relay, read API. Không gọi LLM."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sse-starlette>=3.0",
    "argon2-cffi>=25.1",
    "cachetools>=6.2",
    "pyyaml>=6.0",
    "structlog>=25.4",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
