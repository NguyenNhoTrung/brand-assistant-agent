[project]
name = "ai-service"
version = "0.1.0"
description = "AI Worker + ingest: LangGraph workflow, RAG, compliance, lớp LLM."
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "langgraph>=1.0",
    "langgraph-checkpoint-redis>=0.1",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "openai>=3.0",
    "qdrant-client>=1.17,<1.19",  # lệch minor tối đa 1 so với server qdrant v1.17 (docker-compose.yml)
    "pyyaml>=6.0",
    "structlog>=25.4",
    "redis>=6.0",
    "numpy>=2.0",
    "tiktoken>=0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
rag = ["fastembed>=0.7"]   # BM25 sparse — chỉ cần trong image (nặng)

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]
